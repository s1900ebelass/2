version: '3.8'

services:
  debian-desktop:
    image: lscr.io/linuxserver/webtop:debian-xfce
    container_name: debian_gui
    ports:
      - "6080:3000"
    environment:
      - PUID=1000
      - PGID=1000
      - TZ=Asia/Jakarta
    volumes:
      - ./webtop_data:/config
    shm_size: 1gb
    restart: unless-stopped

  cloudflared:
    image: cloudflare/cloudflared:latest
    container_name: webtop_tunnel
    command: tunnel --url http://debian-desktop:3000
    restart: unless-stopped
    depends_on:
      - debian-desktop
